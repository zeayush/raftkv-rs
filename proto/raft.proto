syntax = "proto3";

package raft;

// ─── Service ────────────────────────────────────────────────────────────────

// The Raft consensus RPC service.
// Every node exposes this to every other node in the cluster.
service RaftService {
    // Sent by a Candidate to gather votes during an election.
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

    // Sent by the Leader to replicate log entries AND as a heartbeat
    // (empty entries_to_append = heartbeat).
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

    // Sent by the Leader when a Follower is too far behind and needs a
    // snapshot instead of individual log entries.
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ─── RequestVote ────────────────────────────────────────────────────────────

message RequestVoteRequest {
    // Candidate's current term. Followers reject if this < their term.
    uint64 term = 1;

    // ID of the candidate requesting the vote.
    string candidate_id = 2;

    // Index of the candidate's last log entry (used for log up-to-date check).
    uint64 last_log_index = 3;

    // Term of the candidate's last log entry.
    uint64 last_log_term = 4;
}

message RequestVoteResponse {
    // Responder's current term. Candidate steps down if this > its term.
    uint64 term = 1;

    // True if the vote was granted.
    bool vote_granted = 2;
}

// ─── AppendEntries ──────────────────────────────────────────────────────────

// A single entry in the replicated log.
message LogEntry {
    // The term when this entry was created by the leader.
    uint64 term = 1;

    // Index of this entry in the log (1-based).
    uint64 index = 2;

    // Serialized command payload (JSON-encoded KvCommand for now).
    bytes command = 3;
}

message AppendEntriesRequest {
    // Leader's current term.
    uint64 term = 1;

    // So follower can redirect clients.
    string leader_id = 2;

    // Index of the log entry immediately preceding the new ones.
    // 0 means the new entries start at the very beginning.
    uint64 prev_log_index = 3;

    // Term of prev_log_index entry. Used for consistency check.
    uint64 prev_log_term = 4;

    // New entries to append. Empty for heartbeat.
    repeated LogEntry entries = 5;

    // Leader's commit index. Followers advance their commit index to
    // min(leader_commit, last new entry index).
    uint64 leader_commit = 6;
}

message AppendEntriesResponse {
    // Follower's current term.
    uint64 term = 1;

    // True if the consistency check passed and entries were appended.
    bool success = 2;

    // Optimisation: the index of the first conflicting entry so the leader
    // can quickly rewind next_index without probing one-by-one.
    // 0 means no conflict info (leader should decrement next_index by 1).
    uint64 conflict_index = 3;

    // Term of the conflicting entry (allows faster rollback).
    uint64 conflict_term = 4;
}

// ─── InstallSnapshot ────────────────────────────────────────────────────────

message InstallSnapshotRequest {
    // Leader's current term.
    uint64 term = 1;

    string leader_id = 2;

    // The snapshot replaces all log entries up through this index.
    uint64 last_included_index = 3;

    // Term of last_included_index.
    uint64 last_included_term = 4;

    // Raw snapshot bytes (the serialized state machine).
    // For large snapshots this would be chunked; we keep it simple here.
    bytes data = 5;
}

message InstallSnapshotResponse {
    // Follower's current term.
    uint64 term = 1;
}
