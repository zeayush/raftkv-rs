syntax = "proto3";

package kv;

// ─── Service ────────────────────────────────────────────────────────────────

// The user-facing key-value service.
// Clients (and the Redis proxy) talk to any node via this service.
// Non-leader nodes MUST redirect to the current leader.
service KvService {
    rpc Get(GetRequest)       returns (GetResponse);
    rpc Set(SetRequest)       returns (SetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);

    // Returns the current leader's address so clients can redirect themselves.
    rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);
}

// ─── Messages ────────────────────────────────────────────────────────────────

message GetRequest {
    string key = 1;
}

message GetResponse {
    // The value, or empty bytes if the key does not exist.
    bytes value = 1;

    // True if the key was found.
    bool found = 2;

    // If not the leader, the address to redirect to (host:port).
    string redirect_to = 3;
}

message SetRequest {
    string key = 1;
    bytes  value = 2;
}

message SetResponse {
    bool   success = 3;
    string redirect_to = 4;
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
    bool   success = 1;
    string redirect_to = 2;
}

message GetLeaderRequest {}

message GetLeaderResponse {
    string leader_id      = 1;
    string leader_address = 2;
}
