[package]
name = "raftkv-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "raftkv"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC + protobuf
tonic = "0.11"
prost = "0.12"

# Storage
rocksdb = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Randomness (for election timeouts)
rand = "0.8"

# CLI / config
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Consistent hashing (Month 1 library)
consistent-hash-rs = { git = "https://github.com/zeayush/consistent-hash-rs" }

# Async channels / utilities
async-trait = "0.1"
futures = "0.3"
bytes = "1"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[[bench]]
name = "throughput"
harness = false
