[node]
id       = "node3"
address  = "0.0.0.0:7001"
data_dir = "/data/node3"

[cluster]
peers = [
  { id = "node1", address = "node1:7001" },
  { id = "node2", address = "node2:7001" },
]

[raft]
heartbeat_interval_ms   = 50
election_timeout_min_ms = 150
election_timeout_max_ms = 300
snapshot_threshold      = 1000

[redis_proxy]
listen = "0.0.0.0:6379"
